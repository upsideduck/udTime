[project]
name = "udtime-frontend"
version = "2.0.0"
description = "udTime web GUI (Jinja2 + HTMX), talks to the udTime backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
