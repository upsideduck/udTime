<form hx-post="/profile/avatar" hx-encoding="multipart/form-data" hx-disabled-elt="find button[type=submit]" hx-disinherit="hx-disabled-elt">
  <div class="modal-header">
    <h5 class="modal-title">Change avatar</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body d-flex align-items-center gap-3">
    <span class="avatar-circle lg flex-shrink-0">
      <img src="/avatar" alt="" data-hide-on-error>
      {{ (me.firstname or me.username)[:1] | upper }}
    </span>
    <div class="flex-grow-1">
      <input class="form-control" type="file" name="file" accept="image/jpeg,image/png,image/gif" required>
      <div class="form-text">JPEG, PNG or GIF, max 20 kB.</div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Upload</button>
  </div>
</form>
