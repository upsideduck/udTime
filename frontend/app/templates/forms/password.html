<form hx-post="/profile/password" hx-disabled-elt="find button[type=submit]" hx-disinherit="hx-disabled-elt">
  <div class="modal-header">
    <h5 class="modal-title">Change password</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    {% if sso %}<p class="small text-muted">You signed in with {{ sso_label }}. This changes the password for
      the udTime login form only.</p>{% endif %}
    <input type="text" name="username" value="{{ me.username }}" autocomplete="username" hidden>
    <div class="mb-3">
      <label class="form-label" for="current_password">Current password</label>
      <input class="form-control" type="password" id="current_password" name="current_password"
             autocomplete="current-password" required autofocus>
    </div>
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" type="password" id="new_password" name="new_password" minlength="8"
               maxlength="1024" autocomplete="new-password" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="confirm_password">Repeat new password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8"
               maxlength="1024" autocomplete="new-password" required>
      </div>
    </div>
    <div class="form-text mt-2">At least 8 characters.</div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Change password</button>
  </div>
</form>
