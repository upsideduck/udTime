<form hx-post="/forms/profile" hx-disabled-elt="find button[type=submit]" hx-disinherit="hx-disabled-elt">
  <div class="modal-header">
    <h5 class="modal-title">Edit settings</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <div class="row g-3">
      <div class="col-sm-4">
        <label class="form-label" for="p-offset">Starting offset</label>
        <input class="form-control" id="p-offset" name="offset" value="{{ profile.offset | hm }}"
               pattern="(\+|-)?\d{1,4}(:[0-5]\d)?" required>
        <div class="form-text">Balance at the statistics start, e.g. -02:30</div>
      </div>
      <div class="col-sm-8">
        <label class="form-label" for="p-tz">Timezone</label>
        <select class="form-select" id="p-tz" name="timezone">
          {% for zone in timezones %}<option {% if zone == profile.timezone %}selected{% endif %}>{{ zone }}</option>{% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
