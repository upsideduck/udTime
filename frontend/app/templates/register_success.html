{% extends "base.html" %}
{% block auth %}
<div class="surface auth-card text-center">
  <div class="brand-mark mx-auto mb-3" style="width:3rem;height:3rem;font-size:1.4rem;background:var(--app-success)"><i class="bi bi-check-lg"></i></div>
  <h1 class="h4 fw-bold">You're all set</h1>
  <p class="text-muted">The account <strong>{{ username }}</strong> has been created.</p>
  <a class="btn btn-primary w-100" href="/login">Sign in</a>
</div>
{% endblock %}
