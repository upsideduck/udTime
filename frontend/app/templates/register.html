{% extends "base.html" %}
{% block title %}Register - udTime{% endblock %}
{% block auth %}
<div class="surface auth-card wide">
  <div class="brand mb-4"><span class="brand-mark"><i class="bi bi-clock-history"></i></span> udTime</div>
  <h1 class="h4 fw-bold mb-1">Create your account</h1>
  <p class="text-muted mb-4">Set up your work schedule to start tracking.</p>
  {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username" value="{{ form.username or '' }}" required>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6"><label class="form-label">First name</label>
        <input class="form-control" name="firstname" value="{{ form.firstname or '' }}"></div>
      <div class="col-sm-6"><label class="form-label">Last name</label>
        <input class="form-control" name="lastname" value="{{ form.lastname or '' }}"></div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-sm-4"><label class="form-label">Hours per week</label>
        <input class="form-control" type="number" step="0.25" min="1" name="workweek_hours" value="{{ form.workweek_hours }}" required></div>
      <div class="col-sm-3"><label class="form-label">Days</label>
        <input class="form-control" type="number" min="1" max="7" name="daysinworkweek" value="{{ form.daysinworkweek }}" required></div>
      <div class="col-sm-5"><label class="form-label">Timezone</label>
        <input class="form-control" name="timezone" value="{{ form.timezone or '' }}" placeholder="Europe/Stockholm"></div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-sm-6"><label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" minlength="4" required></div>
      <div class="col-sm-6"><label class="form-label">Confirm password</label>
        <input class="form-control" type="password" name="cpassword" minlength="4" required></div>
    </div>
    <button class="btn btn-primary btn-lg w-100">Create account</button>
  </form>
  <p class="mt-4 mb-0 small text-center text-muted">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
