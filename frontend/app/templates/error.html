{% extends "base.html" %}
{% macro message() %}
  <div class="surface auth-card text-center mx-auto">
    <div class="status-mark danger mx-auto mb-3"><i class="bi bi-exclamation-lg"></i></div>
    <h1 class="h4 fw-bold">Something went wrong</h1>
    <p class="text-muted">{{ error }}</p>
    <a class="btn btn-soft" href="/">Back to start</a>
  </div>
{% endmacro %}
{% block content %}<div class="py-5">{{ message() }}</div>{% endblock %}
{% block auth %}{{ message() }}{% endblock %}
